<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bid Tender - Search Tenders</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .hero-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 60px 0;
            color: white;
        }
        .search-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-top: -50px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
        }
        .tender-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border: none;
            border-radius: 10px;
        }
        .tender-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }
        .admin-link {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
        }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <span class="navbar-brand fw-bold fs-4">Bid Tender</span>
        </div>
    </nav>

    <section class="hero-section text-center">
        <div class="container">
            <h1 class="display-4 fw-bold mb-3">Find Government Tenders</h1>
            <p class="lead">Search and browse all available tenders by ID, Name, or Department</p>
        </div>
    </section>

    <div class="container">
        <div class="search-card">
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label text-muted small">Search by Tender ID</label>
                    <input type="text" class="form-control form-control-lg" id="searchId" placeholder="e.g., TND123ABC">
                </div>
                <div class="col-md-4">
                    <label class="form-label text-muted small">Search by Tender Name</label>
                    <input type="text" class="form-control form-control-lg" id="searchName" placeholder="e.g., Road Construction">
                </div>
                <div class="col-md-4">
                    <label class="form-label text-muted small">Search by Department</label>
                    <input type="text" class="form-control form-control-lg" id="searchDepartment" placeholder="e.g., IT, PWD, Health">
                </div>
                <div class="col-12 text-center mt-4">
                    <button class="btn btn-primary btn-lg px-5" onclick="searchTenders()">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16" class="me-2">
                            <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/>
                        </svg>
                        Search Tenders
                    </button>
                    <button class="btn btn-outline-secondary btn-lg ms-2" onclick="clearSearch()">Clear</button>
                </div>
            </div>
        </div>
    </div>

    <div class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="mb-0">
                <span id="resultsTitle">All Available Tenders</span>
                <span id="resultsCount" class="badge bg-primary ms-2">0</span>
            </h3>
            <button class="btn btn-outline-primary" onclick="loadTenders()">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" class="me-1">
                    <path fill-rule="evenodd" d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2v1z"/>
                    <path d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466z"/>
                </svg>
                Refresh
            </button>
        </div>

        <div id="loading" class="text-center py-5">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-2 text-muted">Loading tenders...</p>
        </div>

        <div id="noResults" class="alert alert-info d-none">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16" class="me-2">
                <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/>
                <path d="M7.002 11a1 1 0 1 1 2 0 1 1 0 0 1-2 0zM7.1 4.995a.905.905 0 1 1 1.8 0l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 4.995z"/>
            </svg>
            No tenders found matching your search criteria. Try different keywords.
        </div>

        <div id="tenderList" class="row">
        </div>
    </div>

    <!-- Admin Link -->
    <a href="admin-login.html" class="admin-link btn btn-danger btn-sm shadow">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16" class="me-1">
            <path d="M11 5a3 3 0 1 1-6 0 3 3 0 0 1 6 0zM8 7a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm.256 7a4.474 4.474 0 0 1-.229-1.004H3c.001-.246.154-.986.832-1.664C4.484 10.68 5.711 10 8 10c.26 0 .507.009.74.025.226-.341.496-.65.804-.918C9.077 9.038 8.564 9 8 9c-5 0-6 3-6 4s1 1 1 1h5.256zm3.63-4.54c.18-.613 1.048-.613 1.229 0l.043.148a.64.64 0 0 0 .921.382l.136-.074c.561-.306 1.175.308.87.869l-.075.136a.64.64 0 0 0 .382.92l.149.045c.612.18.612 1.048 0 1.229l-.15.043a.64.64 0 0 0-.38.921l.074.136c.305.561-.309 1.175-.87.87l-.136-.075a.64.64 0 0 0-.92.382l-.045.149c-.18.612-1.048.612-1.229 0l-.043-.15a.64.64 0 0 0-.921-.38l-.136.074c-.561.305-1.175-.309-.87-.87l.075-.136a.64.64 0 0 0-.382-.92l-.148-.045c-.613-.18-.613-1.048 0-1.229l.148-.043a.64.64 0 0 0 .382-.921l-.074-.136c-.306-.561.308-1.175.869-.87l.136.075a.64.64 0 0 0 .92-.382l.045-.148zM14 12.5a1.5 1.5 0 1 0-3 0 1.5 1.5 0 0 0 3 0z"/>
        </svg>
        Admin
    </a>

    <footer class="bg-dark text-white text-center py-4 mt-5">
        <div class="container">
            <p class="mb-0">Bid Tender - Your Trusted Tender Portal</p>
        </div>
    </footer>

    <!-- Tender Details Modal -->
    <div class="modal fade" id="tenderModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="modalTitle">Tender Details</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="modalBody">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let allTenders = [];

        async function loadTenders() {
            const loading = document.getElementById('loading');
            const tenderList = document.getElementById('tenderList');
            const noResults = document.getElementById('noResults');
            const resultsCount = document.getElementById('resultsCount');

            loading.classList.remove('d-none');
            tenderList.innerHTML = '';
            noResults.classList.add('d-none');

            try {
                const response = await fetch('/api/tenders');
                const data = await response.json();

                loading.classList.add('d-none');

                if (data.tenders && data.tenders.length > 0) {
                    allTenders = data.tenders;
                    displayTenders(allTenders);
                    resultsCount.textContent = allTenders.length;
                } else {
                    noResults.classList.remove('d-none');
                    noResults.innerHTML = `
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16" class="me-2">
                            <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/>
                            <path d="M7.002 11a1 1 0 1 1 2 0 1 1 0 0 1-2 0zM7.1 4.995a.905.905 0 1 1 1.8 0l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 4.995z"/>
                        </svg>
                        No tenders available at the moment. Please check back later.
                    `;
                    resultsCount.textContent = '0';
                }
            } catch (error) {
                loading.classList.add('d-none');
                noResults.classList.remove('d-none');
                noResults.textContent = 'Error loading tenders. Please try again.';
                resultsCount.textContent = '0';
            }
        }

        function displayTenders(tenders) {
            const tenderList = document.getElementById('tenderList');
            const noResults = document.getElementById('noResults');
            const resultsCount = document.getElementById('resultsCount');

            tenderList.innerHTML = '';
            resultsCount.textContent = tenders.length;

            if (tenders.length === 0) {
                noResults.classList.remove('d-none');
                return;
            }

            noResults.classList.add('d-none');

            tenders.forEach(tender => {
                const closingDate = tender.closingDate ? new Date(tender.closingDate) : null;
                const isExpired = closingDate && closingDate < new Date();
                const statusBadge = isExpired
                    ? '<span class="badge bg-secondary">Closed</span>'
                    : '<span class="badge bg-success">Open</span>';

                tenderList.innerHTML += `
                    <div class="col-md-6 col-lg-4 mb-4">
                        <div class="card tender-card shadow-sm h-100">
                            <div class="card-body">
                                <div class="d-flex justify-content-between mb-2">
                                    <span class="badge bg-primary">ID: ${tender.id}</span>
                                    ${statusBadge}
                                </div>
                                <span class="badge bg-info mb-2">${tender.department || 'General'}</span>
                                <h5 class="card-title">${tender.title}</h5>
                                <p class="card-text text-muted small">${(tender.description || '').substring(0, 100)}${(tender.description || '').length > 100 ? '...' : ''}</p>
                                <hr>
                                <div class="row text-center">
                                    <div class="col-6 border-end">
                                        <small class="text-muted d-block">Value</small>
                                        <strong class="text-primary">${tender.value || 'N/A'}</strong>
                                    </div>
                                    <div class="col-6">
                                        <small class="text-muted d-block">Closing Date</small>
                                        <strong class="${isExpired ? 'text-secondary' : 'text-danger'}">${tender.closingDate || 'TBD'}</strong>
                                    </div>
                                </div>
                            </div>
                            <div class="card-footer bg-white border-0 pb-3">
                                <button class="btn btn-primary btn-sm w-100" onclick="viewTender('${tender.id}')">
                                    View Full Details
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function searchTenders() {
            const searchId = document.getElementById('searchId').value.toLowerCase().trim();
            const searchName = document.getElementById('searchName').value.toLowerCase().trim();
            const searchDepartment = document.getElementById('searchDepartment').value.toLowerCase().trim();
            const resultsTitle = document.getElementById('resultsTitle');

            const filtered = allTenders.filter(tender => {
                const matchesId = !searchId || tender.id.toLowerCase().includes(searchId);
                const matchesName = !searchName || tender.title.toLowerCase().includes(searchName);
                const matchesDepartment = !searchDepartment || (tender.department || '').toLowerCase().includes(searchDepartment);
                return matchesId && matchesName && matchesDepartment;
            });

            if (searchId || searchName || searchDepartment) {
                resultsTitle.textContent = 'Search Results';
            } else {
                resultsTitle.textContent = 'All Available Tenders';
            }

            displayTenders(filtered);
        }

        function clearSearch() {
            document.getElementById('searchId').value = '';
            document.getElementById('searchName').value = '';
            document.getElementById('searchDepartment').value = '';
            document.getElementById('resultsTitle').textContent = 'All Available Tenders';
            displayTenders(allTenders);
        }

        function viewTender(id) {
            const tender = allTenders.find(t => t.id === id);
            if (tender) {
                const closingDate = tender.closingDate ? new Date(tender.closingDate) : null;
                const isExpired = closingDate && closingDate < new Date();
                const statusText = isExpired ? 'Closed' : 'Open';
                const statusClass = isExpired ? 'bg-secondary' : 'bg-success';

                document.getElementById('modalTitle').textContent = tender.title;
                document.getElementById('modalBody').innerHTML = `
                    <div class="row mb-4">
                        <div class="col-md-6">
                            <p><strong>Tender ID:</strong> <span class="badge bg-primary">${tender.id}</span></p>
                            <p><strong>Department:</strong> <span class="badge bg-info">${tender.department || 'General'}</span></p>
                            <p><strong>Status:</strong> <span class="badge ${statusClass}">${statusText}</span></p>
                        </div>
                        <div class="col-md-6">
                            <p><strong>Estimated Value:</strong> ${tender.value || 'Not specified'}</p>
                            <p><strong>Closing Date:</strong> <span class="text-danger fw-bold">${tender.closingDate || 'Not specified'}</span></p>
                            <p><strong>Posted On:</strong> ${new Date(tender.createdAt).toLocaleDateString()}</p>
                        </div>
                    </div>
                    <hr>
                    <h6 class="text-primary mb-3">Description:</h6>
                    <p class="bg-light p-3 rounded">${tender.description || 'No description available.'}</p>
                `;
                new bootstrap.Modal(document.getElementById('tenderModal')).show();
            }
        }

        // Add search on Enter key
        ['searchId', 'searchName', 'searchDepartment'].forEach(id => {
            document.getElementById(id).addEventListener('keypress', (e) => {
                if (e.key === 'Enter') searchTenders();
            });
        });

        // Load tenders on page load
        loadTenders();
    </script>
</body>
</html>
